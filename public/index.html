<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#fffdf7">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Court Radar">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="description" content="Live tennis court availability across South London, in one grid.">
    <title>Court Radar — South London tennis availability</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <div class="app">
      <div class="bar" id="bar">
      <header class="topbar">
        <a class="brand" href="/" aria-label="Court Radar home">
          <span class="brand-mark" aria-hidden="true">✦</span>
          <span class="brand-name">Court Radar</span>
        </a>
        <div class="topbar-actions">
          <button id="filters-toggle" class="icon-button filters-toggle" type="button" aria-expanded="false" aria-controls="filters" title="Filters">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg>
          </button>
          <div class="segmented view-toggle" role="group" aria-label="View">
            <button type="button" data-view="grid" title="Grid"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M3 15h18M9 3v18M15 3v18"/></svg><span class="sr-only">Grid</span></button>
            <button type="button" data-view="map" title="Map"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2-6-2ZM9 4v14M15 6v14"/></svg><span class="sr-only">Map</span></button>
          </div>
          <p class="freshness" aria-live="polite">
            <span class="pulse" aria-hidden="true"></span>
            <span id="freshness">Checking courts…</span>
          </p>
          <button id="refresh" class="icon-button" type="button" aria-label="Refresh availability" title="Refresh">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.34-5.66M20 4v5h-5"/></svg>
          </button>
          <button id="share" class="icon-button" type="button" aria-label="Copy a link to this view" title="Copy link">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 14a4 4 0 0 0 5.66 0l3-3a4 4 0 0 0-5.66-5.66l-1 1M14 10a4 4 0 0 0-5.66 0l-3 3a4 4 0 0 0 5.66 5.66l1-1"/></svg>
          </button>
        </div>
      </header>

      <nav class="days" aria-label="Date">
        <div id="day-strip" class="day-strip"></div>
      </nav>

      <section id="filters" class="toolbar" aria-label="Filters">
        <div class="filter">
          <button id="venues-button" class="pill" type="button" aria-expanded="false" aria-controls="venues-panel">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 10c0 5-8 12-8 12s-8-7-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg>
            <span class="sr-only">Venues:</span>
            <strong id="venues-label">—</strong>
          </button>
          <div id="venues-panel" class="popover venues-popover" hidden>
            <div class="popover-head">
              <h2>Venues</h2>
              <button class="popover-close" type="button" data-close aria-label="Close">×</button>
            </div>
            <input id="venue-search" class="search" type="search" placeholder="Search by name or postcode" autocomplete="off">
            <div class="quick-actions">
              <button type="button" data-clear-venues>Clear all</button>
            </div>
            <div id="venue-options" class="venue-options"></div>
          </div>
        </div>

        <div class="filter">
          <button id="hours-button" class="pill" type="button" aria-expanded="false" aria-controls="hours-panel">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
            <span class="sr-only">Hours:</span>
            <strong id="hours-label">Any time</strong>
          </button>
          <div id="hours-panel" class="popover hours-popover" hidden>
            <div class="popover-head">
              <h2>Hours</h2>
              <button class="popover-close" type="button" data-close aria-label="Close">×</button>
            </div>
            <div class="presets">
              <button type="button" data-preset="any">Any time</button>
              <button type="button" data-preset="morning">Morning</button>
              <button type="button" data-preset="afternoon">Afternoon</button>
              <button type="button" data-preset="evening">Evening</button>
            </div>
            <div id="hour-options" class="hour-options"></div>
            <fieldset class="match-options">
              <legend>A court must be free</legend>
              <label><input type="radio" name="match" value="all"> At every chosen hour</label>
              <label><input type="radio" name="match" value="any"> At any chosen hour</label>
            </fieldset>
            <p class="hint">You can also tap an hour at the top of the grid.</p>
          </div>
        </div>

        <label class="pill switch">
          <input id="hide-full" type="checkbox" role="switch" checked>
          <span class="switch-track" aria-hidden="true"><span class="switch-thumb"></span></span>
          <span>Hide unavailable</span>
        </label>

        <div id="surface-control" class="segmented" role="group" aria-label="Surface"></div>

        <label class="pill select-pill">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3 16 4 4 4-4M7 20V4M21 8l-4-4-4 4M17 4v16"/></svg>
          <span class="sr-only">Sort</span>
          <select id="sort">
            <option value="default">Venue list</option>
            <option value="free">Most free</option>
            <option value="near">Nearest to me</option>
          </select>
        </label>
      </section>

      </div>

      <main class="stage">
        <div id="grid-view" class="grid-scroller" aria-label="Court availability"></div>
        <div id="map-view" class="map-view" hidden>
          <div id="map" class="map"></div>
          <div class="map-key">
            <span><i class="key-dot open"></i> Has availability</span>
            <span><i class="key-dot full"></i> No availability</span>
            <span><i class="key-dot off"></i> Not in your venues</span>
          </div>
        </div>
      </main>
    </div>

    <div id="notice" class="notice" role="status" hidden></div>
    <div id="tooltip" class="tooltip" role="tooltip" hidden></div>
    <div id="sheet-backdrop" class="sheet-backdrop" hidden></div>
    <script type="module" src="/js/main.js"></script>
  </body>
</html>
